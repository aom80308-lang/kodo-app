name: Preview regression tests

on:
  push:
    branches:
      - fix/language-persistence-2026-11-05
  pull_request:
    branches:
      - fix/language-persistence-2026-11-05

permissions:
  contents: read

jobs:
  auth-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Check out preview branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run guest migration regression tests
        run: node --test tests/auth-migration.test.js
      - name: Check inline JavaScript syntax
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import subprocess
          import tempfile

          html = pathlib.Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(
              r"<script\b(?![^>]*\bsrc=)[^>]*>(.*?)</script>",
              html,
              flags=re.IGNORECASE | re.DOTALL,
          )
          if not scripts:
              raise SystemExit("No inline scripts found")
          with tempfile.TemporaryDirectory() as temp_dir:
              for index, source in enumerate(scripts):
                  script_path = pathlib.Path(temp_dir) / f"inline-{index}.js"
                  script_path.write_text(source, encoding="utf-8")
                  subprocess.run(["node", "--check", str(script_path)], check=True)
          print(f"Syntax check passed for {len(scripts)} inline scripts.")
          PY
